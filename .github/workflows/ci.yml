name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: center
          POSTGRES_PASSWORD: center_ci_only
          POSTGRES_DB: center_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U center -d center_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://center:center_ci_only@localhost:5432/center
      TEST_DATABASE_URL: postgresql://center:center_ci_only@localhost:5432/center_test
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations (les fichiers prisma/migrations doivent être commités)
        run: test -d apps/api/prisma/migrations
      - run: pnpm test:integration
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://exemple.invalid

  audit:
    name: Audit des dépendances (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Les alertes connues de la CLI Prisma (hors exécution) sont documentées dans documentation/security.md.
      - run: pnpm audit --prod --audit-level=high

  docker:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/api.Dockerfile, target: runtime, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          build-args: NEXT_PUBLIC_SITE_URL=https://exemple.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max
